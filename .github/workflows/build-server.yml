name: build-server

on:
  push:
    branches: [master, main, unstable]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        go-version: ['1.22']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build server
        run: |
          cd alttp-server
          go build -o o2-server-${{ github.sha }} .
          ls -lh

      - name: Test
        run: |
          cd alttp-server
          go vet ./...
          go test -count=1 ./...

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: o2-server-linux-amd64
          path: alttp-server/o2-server-*
          if-no-files-found: error